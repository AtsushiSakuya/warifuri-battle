<script>
// ==CORE==
const BASE = {hp:30, atk:4, def:1, spd:3};
const GAIN = {hp:8, atk:2, def:2, spd:1};
const STAT_LABEL = {hp:'HP', atk:'攻撃', def:'防御', spd:'速度'};
const STATS = ['hp','atk','def','spd'];
const SKILLS = {
  power:  {name:'強打', cost:2, desc:'3回行動ごとにダメージ2倍'},
  pierce: {name:'貫通', cost:2, desc:'4回行動ごとに防御無視の攻撃'},
  double: {name:'連撃', cost:3, desc:'2回行動ごとに追撃(60%)'},
  heal:   {name:'回復', cost:2, desc:'4回行動ごとにHPを25%回復'},
  drain:  {name:'吸収', cost:2, desc:'与えたダメージの20%を回復'}
};
const MAX_TURNS = 20, START_PTS = 10, CLEAR_BONUS = 3, SLOTS = 3;
const TIME_UNIT = 12, MAX_TIME = 72; // 速度12で1時間ごとに1行動。MAX_TIMEを超えたら時間切れ
const DAILY_CAP = 40;
const SITE_URL = 'https://atsushisakuya.github.io/warifuri-battle/';
const RESTRICTIONS = {
  nodef:    {name:'防御に振れない', stat:'def'},
  nospd:    {name:'速度に振れない', stat:'spd'},
  noatk:    {name:'攻撃に振れない', stat:'atk'},
  nohp:     {name:'HPに振れない', stat:'hp'},
  noskill:  {name:'スキル禁止', slots:0},
  oneskill: {name:'スキルは1枠のみ', slots:1}
};
function restrictionSlots(r){ const x = RESTRICTIONS[r]; return (x && x.slots !== undefined) ? x.slots : SLOTS; }
function restrictionBlocked(r, k){ const x = RESTRICTIONS[r]; return !!(x && x.stat === k); }

const STAGES = [
  {name:'1. スライム', hint:'まずは基本。攻撃と体力のバランスを取ろう。', stats:{hp:71,atk:9,def:3,spd:3}, skills:[]},
  {name:'2. ストーンガード',     hint:'防御が高い。攻撃を厚くしないとダメージが通らない。', stats:{hp:76,atk:8,def:6,spd:4}, skills:[]},
  {name:'3. ダークバット',       hint:'とにかく速い。速度を上げて手数で張り合うか、速攻で倒そう。', stats:{hp:68,atk:13,def:2,spd:8}, skills:[]},
  {name:'4. ヒールマッシュ',   hint:'回復で粘る。短期決戦を狙え。', stats:{hp:158,atk:11,def:5,spd:5}, skills:['heal']},
  {name:'5. オーガ',   hint:'一撃が重い。防御で耐えるか、速攻で倒すか。', stats:{hp:167,atk:19,def:7,spd:3}, skills:['power']},
  {name:'6. ヴァンパイア',   hint:'与ダメージで回復する。削り負けに注意。', stats:{hp:259,atk:18,def:6,spd:7}, skills:['drain']},
  {name:'7. 双剣スケルトン',   hint:'手数が多く防御も貫通してくる。', stats:{hp:153,atk:15,def:6,spd:9}, skills:['double','pierce']},
  {name:'8. 魔王ゼロ',       hint:'最終ボス。スキルなしでは勝てない。組み合わせを考えよう。', stats:{hp:212,atk:19,def:7,spd:8}, skills:['power','heal']}
];

function playerStats(alloc){
  const s = {};
  for (const k of STATS) s[k] = BASE[k] + GAIN[k] * (alloc[k] || 0);
  return s;
}
function makeUnit(name, stats, skills){
  return {name, maxhp:stats.hp, hp:stats.hp, atk:stats.atk, def:stats.def, spd:stats.spd, skills:skills.slice(), n:0};
}
function simulate(pu, eu, quiet){
  const P = Object.assign({}, pu, {skills:pu.skills.slice(), n:0});
  const E = Object.assign({}, eu, {skills:eu.skills.slice(), n:0});
  const log = [];
  let turn = 0;
  const push = quiet ? () => {} : (msg, meta) => log.push(Object.assign({turn, msg, php:Math.max(0,P.hp), ehp:Math.max(0,E.hp)}, meta || {}));
  const heal = (u, v) => { const before = u.hp; u.hp = Math.min(u.maxhp, u.hp + v); return u.hp - before; };
  const act = (u, t) => {
    u.n++;
    const has = (k) => u.skills.includes(k);
    const base = Math.max(Math.ceil(u.atk * 0.25), u.atk - t.def);
    let dmg = base, label = '攻撃';
    if (has('power') && u.n % 3 === 0){ dmg = base * 2; label = '強打'; }
    else if (has('pierce') && u.n % 4 === 0){ dmg = Math.max(1, u.atk); label = '貫通'; }
    t.hp -= dmg;
    push(`${u.name}の${label}! ${t.name}に${dmg}ダメージ`, {kind:'hit', side:(u === P ? 'p' : 'e'), label, dmg});
    if (has('drain')){
      const h = heal(u, Math.floor(dmg * 0.2));
      if (h > 0) push(`${u.name}は吸収で${h}回復`, {kind:'heal', side:(u === P ? 'p' : 'e'), amt:h});
    }
    if (t.hp > 0 && has('double') && u.n % 2 === 0){
      const d2 = Math.max(1, Math.floor(base * 0.6));
      t.hp -= d2;
      push(`${u.name}の連撃! ${t.name}に${d2}ダメージ`, {kind:'hit', side:(u === P ? 'p' : 'e'), label:'連撃', dmg:d2});
    }
    if (has('heal') && u.n % 4 === 0){
      const h = heal(u, Math.floor(u.maxhp * 0.25));
      push(`${u.name}は回復して${h}HP回復`, {kind:'heal', side:(u === P ? 'p' : 'e'), amt:h});
    }
  };
  const period = (u) => TIME_UNIT / Math.max(1, u.spd);
  let pNext = period(P), eNext = period(E), time = 0, actions = 0;
  while (true){
    const pFirst = pNext <= eNext + 1e-9; // 同時刻ならあなたが先
    const u = pFirst ? P : E, t = pFirst ? E : P;
    time = pFirst ? pNext : eNext;
    if (time > MAX_TIME + 1e-9) break;
    turn = Math.floor(time);
    act(u, t);
    actions++;
    if (pFirst) pNext += period(P); else eNext += period(E);
    if (P.hp <= 0 || E.hp <= 0){
      const win = E.hp <= 0;
      push(win ? `${E.name}を撃破!` : `${P.name}は倒れた…`, {kind:'end', win});
      return {win, log, turns:actions};
    }
  }
  push('時間切れ。決着がつかず敗北…', {kind:'end', win:false});
  return {win:false, log, turns:actions};
}
function skillCost(list){ return list.reduce((s,k)=>s+SKILLS[k].cost, 0); }
function statSpent(alloc){ return STATS.reduce((s,k)=>s+(alloc[k]||0), 0); }

// 縛り条件下で勝てる最少ポイントを求める(生成スクリプト用)
function solveMin(enemy, restr, cap){
  const slots = restrictionSlots(restr);
  const subsets = [[]];
  for (const k of Object.keys(SKILLS)) for (const s of subsets.slice()) if (s.length < slots) subsets.push([...s, k]);
  const free = STATS.filter(k => !restrictionBlocked(restr, k));
  const eu = makeUnit('e', enemy.stats, enemy.skills);
  for (let T = 0; T <= cap; T++){
    for (const sk of subsets){
      const rem = T - skillCost(sk);
      if (rem < 0) continue;
      let found = null;
      const rec = (i, left, alloc) => {
        if (found) return;
        if (i === free.length - 1){
          alloc[free[i]] = left;
          const a = Object.assign({hp:0,atk:0,def:0,spd:0}, alloc);
          const r = simulate(makeUnit('p', playerStats(a), sk), eu, true);
          if (r.win) found = {alloc:a, skills:sk};
          return;
        }
        for (let v = 0; v <= left && !found; v++){ alloc[free[i]] = v; rec(i+1, left - v, alloc); }
      };
      rec(0, rem, {});
      if (found) return {min:T, sol:found};
    }
  }
  return null;
}
// ==/CORE==

// ステージごとの答えの例(ヒント用)
const STAGE_SOLS = [{"alloc": {"hp": 0, "atk": 4, "def": 2, "spd": 0}, "skills": [], "min": 6}, {"alloc": {"hp": 0, "atk": 4, "def": 3, "spd": 1}, "skills": [], "min": 8}, {"alloc": {"hp": 0, "atk": 4, "def": 4, "spd": 4}, "skills": [], "min": 12}, {"alloc": {"hp": 0, "atk": 8, "def": 3, "spd": 2}, "skills": ["drain"], "min": 15}, {"alloc": {"hp": 1, "atk": 10, "def": 0, "spd": 7}, "skills": [], "min": 18}, {"alloc": {"hp": 2, "atk": 4, "def": 6, "spd": 7}, "skills": ["heal"], "min": 21}, {"alloc": {"hp": 2, "atk": 11, "def": 5, "spd": 6}, "skills": [], "min": 24}, {"alloc": {"hp": 0, "atk": 9, "def": 7, "spd": 5}, "skills": ["power", "heal", "drain"], "min": 27}];

function rasterize(ops){
  const N = ART_N, g = Array.from({length:N}, () => Array(N).fill(null));
  const put = (x,y,c) => { if (x >= 0 && y >= 0 && x < N && y < N) g[y][x] = c; };
  for (const o of ops){
    if (o[0] === 'r'){ for (let y = o[2]; y < o[2] + o[4]; y++) for (let x = o[1]; x < o[1] + o[3]; x++) put(x, y, o[5]); }
    else if (o[0] === 'e'){
      const [, cx, cy, rx, ry, c] = o;
      for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++){
        const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry;
        if (dx * dx + dy * dy <= 1) put(x, y, c);
      }
    } else put(o[1], o[2], o[3]);
  }
  const at = (x,y) => (x < 0 || y < 0 || x >= N || y >= N) ? null : g[y][x];
  const o2 = Array.from({length:N}, () => Array(N).fill(null));
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
    const c = g[y][x];
    if (!c) continue;
    if (c[0] === '!'){ o2[y][x] = c.slice(1); continue; }
    let col = c;
    if (!at(x, y - 1)) col = hexMix(col, '#ffffff', .3); else if (!at(x - 1, y)) col = hexMix(col, '#ffffff', .15);
    if (!at(x, y + 1)) col = hexMix(col, '#000000', .32); else if (!at(x + 1, y)) col = hexMix(col, '#000000', .18);
    o2[y][x] = col;
  }
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
    if (o2[y][x]) continue;
    if (at(x - 1, y) || at(x + 1, y) || at(x, y - 1) || at(x, y + 1)) o2[y][x] = OUTLINE;
  }
  return o2;
}
function gridSvg(o2, style){
  let r = '';
  for (let y = 0; y < ART_N; y++){
    let x = 0;
    while (x < ART_N){
      const c = o2[y][x];
      if (!c){ x++; continue; }
      let w = 1;
      while (x + w < ART_N && o2[y][x + w] === c) w++;
      r += `<rect x="${x}" y="${y}" width="${w}" height="1" fill="${c}"/>`;
      x += w;
    }
  }
  return `<svg class="spr" viewBox="0 0 32 32" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"${style || ''}>${r}</svg>`;
}

// ---------- 日付とデイリー状態 ----------
function todayInfo(){
  const epoch = Math.floor(Date.UTC(2026, 9, 16) / 86400000);
  const d = Math.floor((Date.now() + 9 * 3600000) / 86400000) - epoch;
  const day = Math.max(0, d);
  return {day, idx: DAILY.length ? day % DAILY.length : 0, no: day + 1};
}
function dailyState(){
  const t = todayInfo();
  if (!save.daily || save.daily.day !== t.day){
    save.daily = {day:t.day, tries:0, best:null, alloc:newAlloc(), paid:0};
    persist();
  }
  return save.daily;
}

function fxPlay(){
  const k = pendingFx; pendingFx = null;
  if (!k || !FX[k]) return;
  const box = $('herobox'), fx = $('herofx');
  if (!box || !fx || !document.createElement) return;
  box.className = 'herobox fx';
  setVar(box, '--fx', FX[k][0]);
  const t = document.createElement('div');
  t.className = 'fxt'; t.textContent = FX[k][1];
  fx.appendChild(t);
  for (let n = 0; n < 6; n++){
    const sp = document.createElement('div');
    const ang = n * 60 * Math.PI / 180;
    sp.className = 'spark';
    setVar(sp, '--dx', Math.round(Math.cos(ang) * 36) + 'px');
    setVar(sp, '--dy', Math.round(Math.sin(ang) * 36) + 'px');
    fx.appendChild(sp);
  }
}

  const used = STATS.filter(k => (a[k] || 0) > 0).sort((x, y) => a[y] - a[x]);
  const names = used.slice(0, 2).map(k => STAT_LABEL[k]);
  if (lv === 1){
    return `カギは「${names.join('」と「')}」。` + (sol.skills.length ? 'スキルも活用すると有利です。' : 'スキルなしでも勝てます。');
  }
  if (lv === 2){
    const parts = used.map(k => `${STAT_LABEL[k]} ${Math.max(0, a[k] - 1)}〜${a[k] + 1}pt`);
    return `ポイントの目安: ${parts.join(' / ')}<br>スキル: ${sol.skills.length ? sol.skills.length + '個(攻略に必要)' : '不要'}`;
  }
  const parts = STATS.map(k => `${STAT_LABEL[k]}+${a[k] || 0}`);
  const sk = sol.skills.map(k => SKILLS[k].name).join('・') || 'なし';
  return `答えの一例: ${parts.join(' ')} / スキル: ${sk}<br><span class="small">(合計${statSpent(a) + skillCost(sol.skills)}pt。余ったポイントは自由に使えます)</span>`;
}
function hintSection(tries, sol){
  const lv = hintLevel(tries);
  if (!sol) return '';
  if (lv === 0) return `<div class="card hintcard"><b>💡 ヒント</b><div class="small">あと${2 - tries}回負けると、ヒントが解放されます</div>${ADS.enabled ? '<button onclick="requestHintUnlock()">🎬 広告を見てヒントを見る</button>' : ''}</div>`;
  let h = `<div class="card hintcard"><b>💡 ヒント</b> <span class="small">(Lv${lv}/3・負けるほど具体的になります)</span>`;
  if (hintOpen) h += `<div class="hint">${buildHint(sol, lv)}</div><button onclick="toggleHint()">ヒントを閉じる</button>`;
  else h += `<br><button onclick="toggleHint()">ヒントを見る</button>`;
  return h + '</div>';
}
function toggleHint(){
  hintOpen = !hintOpen;
  if (curView === 'daily'){
    if (hintOpen){ const ds = dailyState(); ds.hinted = true; persist(); }
    showDaily();
  } else showAlloc(curStage);
}
function diagnose(res, pu, eu){
  const last = res.log[res.log.length - 1];
  const left = last.ehp / eu.maxhp;
  const myDmg = Math.max(Math.ceil(pu.atk * 0.25), pu.atk - eu.def);
  const enDmg = Math.max(Math.ceil(eu.atk * 0.25), eu.atk - pu.def);
  const hitsToDie = Math.ceil(pu.maxhp / enDmg);
  const pct = Math.round(100 * myDmg / eu.maxhp);
  const tips = [];
  if (last.msg.indexOf('時間切れ') >= 0) tips.push('時間切れでした。1回の攻撃が軽いか、動く回数が足りません。');
  else if (left <= 0.25) tips.push(`あと少し!敵のHPを${Math.round(left * 100)}%残して負けました。攻撃か速度を1〜2pt足そう。`);
  else {
    if (hitsToDie <= 3) tips.push(`敵の1撃が重く、${hitsToDie}発で倒れます。防御かHPを増やす、または速度を上げて先に倒そう。`);
    if (pct < 6) tips.push(`あなたの1撃は敵HPの約${pct}%しか削れません。攻撃を上げるか、貫通・強打を試そう。`);
    if (pu.spd < eu.spd * 0.7) tips.push('相手の動く回数が多すぎます。速度を上げる手もあります。');
  }
  if (!tips.length) tips.push('スキルを1つ足すと流れが変わるかもしれません。');
  return tips.slice(0, 2).join('<br>');
}

function showSelect(){
  stopTimer();

  STAGES.forEach((s,i)=>{
    const locked = i > save.cleared;
    const done = i < save.cleared;
    const best = save.best[i] ? ` / 最短${save.best[i]}回` : '';
    const label = locked ? '？？？' : s.name;
    h += `<button class="stage" ${locked?'disabled':''} onclick="showAlloc(${i})"><span class="mini ${locked?'sil':''}">${spriteSvg('e' + i)}</span>${done?'★ ':''}${label}${locked?' 🔒':best}</button>`;
  });

function skillLabel(list){ return list.length ? list.map(k=>SKILLS[k].name).join('・') : 'なし'; }
function enemyCard(name, st, skills, hint, key, hue){

// ---------- ステージ戦: 割り振り ----------
let curStage = 0;
function showAlloc(i){
  if (i > save.cleared) i = save.cleared;
  if (curView !== 'stage' || curStage !== i) hintOpen = false;
  curView = 'stage';
  curStage = i;
  stopTimer();
  const st = STAGES[i];
  const a = save.alloc;
  const eb = equipBonus(), ps = stageStats(a);
  trackForm(a);
  const rem = remainPts();
  let h = `<h1>${st.name}</h1>`;
  h += enemyCard(st.name.replace(/^\d+\.\s*/,''), st.stats, st.skills, st.hint, 'e' + i, 0);
  h += `<div class="card statcard">${heroPanel(`残りポイント <span class="pts">${rem}</span> / ${totalPts()}<br><span class="small">行動頻度: 相手の${(ps.spd / st.stats.spd).toFixed(1)}倍</span>`)}`;
  h += `<button class="resetbtn" onclick="resetAlloc();showAlloc(${i})">振り直し</button>`;
  STATS.forEach(k=>{
    h += `<div class="row"><span class="lbl">${STAT_LABEL[k]}</span>
      <button class="pm" onclick="adj('${k}',-1)" ${a[k]<=0?'disabled':''}>−</button>
      <span class="val">${ps[k]} <span class="small">(+${a[k]}${eb[k] ? ' 装備+' + eb[k] : ''})</span></span>
      <button class="pm" onclick="adj('${k}',1)" ${rem<=0?'disabled':''}>＋</button></div>`;
  });
  h += `</div><div class="card"><b>スキル</b> (${a.skills.length}/${SLOTS}枠)`;
  Object.keys(SKILLS).forEach(k=>{
    const on = a.skills.includes(k);
    const can = on || (a.skills.length < SLOTS && rem >= SKILLS[k].cost);
    h += `<button class="skill ${on?'on':''}" ${can?'':'disabled'} onclick="toggleSkill('${k}')">${SKILLS[k].name}(${SKILLS[k].cost}pt) ${SKILLS[k].desc}</button>`;
  });
  h += `</div>`;
  h += itemCard();
  h += hintSection(save.tries[i], STAGE_SOLS[i]);
  h += `<button class="main" onclick="startBattle()">戦闘開始</button><button onclick="showSelect()">戻る</button>`;
  h += `<p class="small">これまでの挑戦: ${save.tries[i]}回</p>`;
  app.innerHTML = h;
  fxPlay();
}
function adj(k, d){
  const a = save.alloc;
  if (d > 0 && remainPts() <= 0) return;
  if (d < 0 && a[k] <= 0) return;
  if (d > 0) pendingFx = k;
  a[k] += d; persist(); showAlloc(curStage);
}
function toggleSkill(k){
  const a = save.alloc;
  const idx = a.skills.indexOf(k);
  if (idx >= 0) a.skills.splice(idx,1);
  else if (a.skills.length < SLOTS && remainPts() >= SKILLS[k].cost){ a.skills.push(k); pendingFx = 'skill'; }
  persist(); showAlloc(curStage);
}

// ---------- デイリー: 割り振り ----------
function showDaily(){
  stopTimer();
  if (curView !== 'daily') hintOpen = false;
  curView = 'daily';
  const t = todayInfo(), p = DAILY[t.idx], ds = dailyState();
  const a = ds.alloc, ps = playerStats(a);
  trackForm(a);
  const used = statSpent(a) + skillCost(a.skills);
  const slots = restrictionSlots(p.r);
  const sp = dailySprite(p.name);
  let h = `<h1>デイリー #${t.no}</h1>`;
  h += `<div class="card"><span class="rule">縛り: ${RESTRICTIONS[p.r].name}</span><br>ルール: 使うポイントが<b>少ないほど高評価</b>(★★★=最少ポイント)</div>`;
  h += enemyCard(p.name, p.stats, p.skills, '', sp.key, sp.hue);
  h += `<div class="card statcard">${heroPanel(`使用ポイント <span class="pts">${used}</span> / 上限${DAILY_CAP}<br><span class="small">行動頻度: 相手の${(ps.spd / p.stats.spd).toFixed(1)}倍</span>`)}`;
  h += `<button class="resetbtn" onclick="resetD()">振り直し</button>`;
  STATS.forEach(k=>{
    const blocked = restrictionBlocked(p.r, k);
    h += `<div class="row"><span class="lbl">${STAT_LABEL[k]}</span>
      <button class="pm" onclick="adjD('${k}',-1)" ${a[k]<=0?'disabled':''}>−</button>
      <span class="val">${ps[k]} <span class="small">(+${a[k]})</span>${blocked?' 🔒':''}</span>
      <button class="pm" onclick="adjD('${k}',1)" ${(blocked||used>=DAILY_CAP)?'disabled':''}>＋</button></div>`;
  });
  h += `</div><div class="card"><b>スキル</b> (${a.skills.length}/${slots}枠)`;
  if (slots === 0) h += `<div class="small">このデイリーではスキルを使えません</div>`;
  Object.keys(SKILLS).forEach(k=>{
    const on = a.skills.includes(k);
    const can = on || (a.skills.length < slots && used + SKILLS[k].cost <= DAILY_CAP);
    h += `<button class="skill ${on?'on':''}" ${can?'':'disabled'} onclick="toggleSkillD('${k}')">${SKILLS[k].name}(${SKILLS[k].cost}pt) ${SKILLS[k].desc}</button>`;
  });
  h += `</div>`;
  h += hintSection(ds.tries, p.sol);
  h += `<button class="main" onclick="startDailyBattle()">戦闘開始</button><button onclick="showHome()">戻る</button>`;
  h += `<p class="small">今日の挑戦: ${ds.tries}回${ds.best ? ` / 最高 ${starStr(ds.best.stars)} ${ds.best.used}pt` : ''}</p>`;
  app.innerHTML = h;
  fxPlay();
}
function adjD(k, d){
  const t = todayInfo(), p = DAILY[t.idx], a = dailyState().alloc;
  const used = statSpent(a) + skillCost(a.skills);
  if (d > 0 && (restrictionBlocked(p.r, k) || used >= DAILY_CAP)) return;
  if (d < 0 && a[k] <= 0) return;
  if (d > 0) pendingFx = k;
  a[k] += d; persist(); showDaily();
}
function toggleSkillD(k){
  const t = todayInfo(), p = DAILY[t.idx], a = dailyState().alloc;
  const used = statSpent(a) + skillCost(a.skills);
  const idx = a.skills.indexOf(k);
  if (idx >= 0) a.skills.splice(idx,1);
  else if (a.skills.length < restrictionSlots(p.r) && used + SKILLS[k].cost <= DAILY_CAP){ a.skills.push(k); pendingFx = 'skill'; }
  persist(); showDaily();
}
function resetD(){ dailyState().alloc = newAlloc(); persist(); showDaily(); }

// ---------- 戦闘(共通) ----------
function setFighter(side, c){
  const el = $('f' + side);
  if (!el) return;
  let cls = 'fighter' + (side === 'e' ? ' foe' : '');
  if (c === 'lunge') cls += ' lunge-' + side;
  else if (c) cls += ' ' + c;
  el.className = cls;
}
function floatText(side, text, cls){
  const fx = $('fx');
  if (!fx || !document.createElement) return;
  const d = document.createElement('div');
  d.className = 'fl ' + cls;
  d.textContent = text;
  d.style.left = side === 'p' ? '20%' : '64%';
  fx.appendChild(d);
  setTimeout(() => { if (d.remove) d.remove(); }, 900);
}
function animateEvent(e){
  if (e.kind === 'hit'){
    const a = e.side, d = a === 'p' ? 'e' : 'p';
    setFighter(a, 'lunge');
    if (e.label && e.label !== '攻撃') floatText(a, e.label + '!', 'skill');
    setTimeout(() => {
      setFighter(a, '');
      setFighter(d, 'hurt');
      floatText(d, '-' + e.dmg, 'dmg');
      setTimeout(() => setFighter(d, ''), 320);
    }, 190);
  } else if (e.kind === 'heal'){
    floatText(e.side, '+' + e.amt, 'heal');
  }
}
function runBattle(titleHtml, pu, eu, res, resultHtml, controlsHtml, eKey, eHue){
  let h = titleHtml;
  h += `<div>あなた <span id="php">${pu.hp}</span>/${pu.maxhp}</div><div class="bar"><i id="pbar" style="width:100%"></i></div>`;
  h += `<div>${eu.name} <span id="ehp">${eu.hp}</span>/${eu.maxhp}</div><div class="bar e"><i id="ebar" style="width:100%"></i></div>`;
  h += `<div id="arena"><div class="fighter" id="fp">${heroSvg(panelAlloc)}</div><div class="fighter foe" id="fe" style="--hue:${eHue || 0}deg">${spriteSvg(eKey)}</div><div id="fx"></div></div>`;
  h += `<div id="log"></div><div id="result"></div><div id="ctrl"><button onclick="skipBattle()">スキップ</button></div>`;
  app.innerHTML = h;
  let idx = 0, fast = false, finished = false;
  const step = () => {
    if (idx >= res.log.length){ finish(); return; }
    let e;
    const lg = $('log');
    do {
      e = res.log[idx++];
      lg.innerHTML += e.msg + '<br>';
    } while (e.kind === 'turn' && idx < res.log.length);
    lg.scrollTop = lg.scrollHeight;
    $('php').textContent = e.php; $('ehp').textContent = e.ehp;
    $('pbar').style.width = (100 * e.php / pu.maxhp) + '%';
    $('ebar').style.width = (100 * e.ehp / eu.maxhp) + '%';
    if (!fast) animateEvent(e);
  };
  const finish = () => {
    if (finished) return;
    finished = true;
    stopTimer();
    setFighter(res.win ? 'e' : 'p', 'dead');
    $('result').innerHTML = `<div class="card">${resultHtml}</div>`;
    $('ctrl').innerHTML = controlsHtml;
  };
  window.skipBattle = () => { fast = true; while (idx < res.log.length) step(); finish(); };
  timer = setInterval(step, Math.max(140, Math.min(560, Math.floor(14000 / Math.max(1, res.log.length)))));
}

function startBattle(){
  const i = curStage, st = STAGES[i];
  const bs = stageStats(save.alloc);
  const usedHp = save.armed.hpup && save.items.hpup > 0, usedAtk = save.armed.atkup && save.items.atkup > 0;
  if (usedHp) bs.hp = Math.floor(bs.hp * 1.25);
  if (usedAtk) bs.atk = Math.ceil(bs.atk * 1.25);
  const pu = makeUnit('あなた', bs, save.alloc.skills);
  const eu = makeUnit(st.name.replace(/^\d+\.\s*/,''), st.stats, st.skills);
  const res = simulate(pu, eu);
  save.tries[i]++;
  let resultHtml, firstClear = false, tries = save.tries[i];
  if (res.win){
    if (!save.best[i] || tries < save.best[i]) save.best[i] = tries;
    if (i === save.cleared){ save.cleared++; firstClear = true; }
    save.tries[i] = 0;
    resultHtml = `<div class="win">勝利! ${tries}回目で突破</div>` + (firstClear ? `<div class="pts">+${CLEAR_BONUS}pt 獲得(総${totalPts()}pt)</div>` : '');
    if (firstClear && i + 1 < STAGES.length) resultHtml += `<div class="hint">次の敵が判明した…</div>`;
  } else {
    resultHtml = `<div class="lose">敗北… (挑戦${tries}回目)</div><div class="hint">💡 ${diagnose(res, pu, eu)}</div>`;
  }
  if (usedHp){ save.items.hpup--; save.armed.hpup = false; }
  if (usedAtk){ save.items.atkup--; save.armed.atkup = false; }
  if (usedHp || usedAtk) resultHtml += `<div class="small">アイテムを使用しました</div>`;
  if (res.win){
    const g = firstClear ? 10 + 5 * i : 3;
    addMedals(g); save.st.wins++;
    resultHtml += `<div class="pts">🪙 +${g}${firstClear ? '(初クリア)' : ''}</div>`;
  } else save.st.losses++;
  resultHtml += achHtml(checkAch());
  persist();
  let c = '';
  if (res.win && i + 1 < STAGES.length) c += `<button class="main" onclick="showAlloc(${i+1})">次のステージ</button>`;
  if (!res.win) c += `<button class="main" onclick="showAlloc(${i})">振り直して再挑戦</button>`;
  c += `<button onclick="showSelect()">ステージ選択</button>`;
  runBattle(`<h1>${st.name}</h1>`, pu, eu, res, resultHtml, c, 'e' + i, 0);
}

let shareText = '';
function copyShare(){
  const done = () => { const b = $('copybtn'); if (b) b.textContent = 'コピーしました'; };
  try{
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(shareText).then(done, () => prompt('コピーして共有してください', shareText));
      return;
    }
  }catch(e){}
  prompt('コピーして共有してください', shareText);
}

function startDailyBattle(){
  const t = todayInfo(), p = DAILY[t.idx], ds = dailyState(), a = ds.alloc;
  const used = statSpent(a) + skillCost(a.skills);
  const pu = makeUnit('あなた', playerStats(a), a.skills);
  const eu = makeUnit(p.name, p.stats, p.skills);
  const res = simulate(pu, eu);
  ds.tries++;
  let resultHtml, rewardHtml = '';
  if (res.win){
    const stars = used <= p.par ? 3 : (used <= p.par + 3 ? 2 : 1);
    if (!ds.best || used < ds.best.used) ds.best = {used, stars, tries:ds.tries};
    const b = ds.best;
    const PAY = {1:10, 2:20, 3:35};
    const prev = ds.paid || 0, target = PAY[b.stars], gain = Math.max(0, target - prev);
    let bonus = 0;
    if (prev === 0){
      const S = save.st;
      S.streak = (S.lastDailyDay === t.day - 1) ? S.streak + 1 : 1;
      S.maxStreak = Math.max(S.maxStreak, S.streak);
      S.lastDailyDay = t.day; S.dailyClears++;
      bonus = Math.min(S.streak, 7) * 3;
    }
    if (b.stars === 3 && !ds.perfectCounted){
      ds.perfectCounted = true; save.st.dailyPerfect++;
      if (!ds.hinted) save.st.nohintPerfect++;
    }
    ds.paid = Math.max(prev, target);
    if (gain + bonus > 0){
      addMedals(gain + bonus);
      rewardHtml = `<div class="pts">🪙 +${gain + bonus}${bonus ? `(連続${save.st.streak}日ボーナス+${bonus}含む)` : ''}</div>`;
    }
    shareText = `割り振りバトル デイリー#${t.no} ${starStr(b.stars)} ${b.used}pt(${b.tries}回目)${ds.hinted ? ' 💡ヒントあり' : ''}\n縛り:${RESTRICTIONS[p.r].name}\n${SITE_URL}`;
    resultHtml = `<div class="win">勝利! <span class="star">${starStr(stars)}</span> ${used}pt</div>`
      + (stars === 3 ? `<div class="pts">パーフェクト!最少ポイントで突破</div>` : `<div class="small">もっと少ないポイントで勝てる振り方があります</div>`)
      + `<pre>${shareText}</pre><button id="copybtn" onclick="copyShare()">結果をコピー</button>`;
  } else {
    resultHtml = `<div class="lose">敗北… (今日の挑戦${ds.tries}回目)</div><div class="hint">💡 ${diagnose(res, pu, eu)}</div>`;
  }
  resultHtml += rewardHtml + achHtml(checkAch());
  persist();
  const c = `<button class="main" onclick="showDaily()">割り振りに戻る</button><button onclick="showHome()">ホームへ</button>`;
  const sp = dailySprite(p.name);
  runBattle(`<h1>デイリー #${t.no}</h1>`, pu, eu, res, resultHtml, c, sp.key, sp.hue);
}

const EQUIP = {

  boots:  {name:'靴', stat:'spd', tiers:[{n:'革の靴', v:1, c:50}, {n:'蒼の靴', v:2, c:120}, {n:'金の靴', v:3, c:220}]}

};
function equipBonus(){
  const b = {hp:0, atk:0, def:0, spd:0};
  for (const k of Object.keys(EQUIP)){ const t = save.owned[k]; if (t > 0) b[EQUIP[k].stat] += EQUIP[k].tiers[t - 1].v; }
  return b;
}
function stageStats(a){
  const s = playerStats(a), b = equipBonus();
  for (const k of STATS) s[k] += b[k];
  return s;
}
function addMedals(n){ save.medals += n; save.st.medalsTotal += n; }

const FORMS = {hp:'アーマー型', atk:'ブレード型', def:'シールド型', spd:'ウィング型', all:'オールラウンド型'};
const FORM_COL = {hp:'#3f6', atk:'#f55', def:'#4af', spd:'#ff0', all:'#fd0'};
const COMBO = {'hp+atk':'バーサーカー型', 'hp+def':'ガーディアン型', 'hp+spd':'レンジャー型', 'atk+def':'ナイト型', 'atk+spd':'アサシン型', 'def+spd':'ウィンドナイト型'};
function formInfo(a){
  const sp = statSpent(a);
  const novice = {key:null, lv:0, label:'見習い'};
  if (sp < 4) return novice;
  const arr = STATS.map(k => [k, a[k] || 0]).sort((x, y) => (y[1] - x[1]) || (STATS.indexOf(x[0]) - STATS.indexOf(y[0])));
  const s1 = arr[0][1] / sp, s2 = arr[1][1] / sp, big = sp >= 6;
  if (s2 >= 0.3 && s1 + s2 >= 0.7){
    const key = [arr[0][0], arr[1][0]].sort((x, y) => STATS.indexOf(x) - STATS.indexOf(y)).join('+');
    return {key, lv:(s1 + s2 >= 0.9 && big) ? 2 : 1, label:COMBO[key]};
  }
  if (s1 >= 0.4) return {key:arr[0][0], lv:(s1 >= 0.6 && big) ? 2 : 1, label:FORMS[arr[0][0]]};
  if (sp >= 8 && STATS.every(k => a[k] / sp >= 0.15)) return {key:'all', lv:1, label:FORMS.all};
  return novice;
}
function heroSvg(a){
  const f = formInfo(a || newAlloc());
  const glow = f.lv >= 2 ? ` style="filter:drop-shadow(0 0 3px ${FORM_COL[f.key.split('+')[0]]})"` : '';
  return gridSvg(rasterize(heroOps(f, save.owned)), glow);
}
function trackForm(a){
  panelAlloc = a;
  const f = formInfo(a);
  let ch = false;
  if (f.key && !save.forms[f.key]){ save.forms[f.key] = true; ch = true; }
  if (f.lv >= 2 && !save.forms.lv2){ save.forms.lv2 = true; ch = true; }
  if (ch){ const n = checkAch(); persist(); toastAch(n); }
}

const ACH = [
  {id:'w1',  name:'初勝利',          d:'ステージ戦で初めて勝つ', r:10, ok:s => s.st.wins >= 1},
  {id:'c4',  name:'中盤突破',        d:'ステージ4をクリア', r:20, ok:s => s.cleared >= 4},
  {id:'c8',  name:'魔王を超えて',  d:'全ステージクリア', r:50, ok:s => s.cleared >= 8},
  {id:'w20', name:'歴戦の勇者',      d:'ステージ戦で通算20勝', r:30, ok:s => s.st.wins >= 20},
  {id:'l10', name:'不屈',            d:'通算10回負けても諦めない', r:15, ok:s => s.st.losses >= 10},
  {id:'d1',  name:'デイリーデビュー', d:'デイリーを初クリア', r:10, ok:s => s.st.dailyClears >= 1},
  {id:'dp',  name:'完璧主義',        d:'デイリーで★3を取る', r:20, ok:s => s.st.dailyPerfect >= 1},
  {id:'dp10',name:'最少ポイントの鬼', d:'デイリーで★3を10回取る', r:60, ok:s => s.st.dailyPerfect >= 10},
  {id:'nh',  name:'実力で',          d:'ヒントなしでデイリー★3', r:25, ok:s => s.st.nohintPerfect >= 1},
  {id:'s3',  name:'三日坊主じゃない', d:'デイリーを3日連続クリア', r:20, ok:s => s.st.maxStreak >= 3},
  {id:'s7',  name:'一週間の習慣',    d:'デイリーを7日連続クリア', r:50, ok:s => s.st.maxStreak >= 7},
  {id:'b1',  name:'初めての買い物',  d:'ショップで何か買う', r:5, ok:s => s.st.bought >= 1},
  {id:'l2',  name:'覚醒',            d:'見た目がLv2に進化する(1つに6割以上、または2つで9割以上)', r:20, ok:s => !!s.forms.lv2},
  {id:'fm',  name:'形態コンプリート', d:'5種類の形態をすべて見る', r:40, ok:s => ['hp','atk','def','spd','all'].every(k => s.forms[k])},
  {id:'fm2', name:'変幻自在',       d:'組み合わせ形態6種をすべて見る', r:80, ok:s => Object.keys(COMBO).every(k => s.forms[k])},
  {id:'eq',  name:'装備マスター',    d:'装備4種を最大まで強化', r:100, ok:s => Object.keys(EQUIP).every(k => s.owned[k] >= 3)},
  {id:'m500',name:'メダルコレクター', d:'メダルを通算500枚集める', r:50, ok:s => s.st.medalsTotal >= 500}
];
function checkAch(){
  const out = [];
  let again = true;
  while (again){
    again = false;
    for (const a of ACH){
      if (!save.ach[a.id] && a.ok(save)){ save.ach[a.id] = true; addMedals(a.r); out.push(a); again = true; }
    }
  }
  return out;
}
function achHtml(list){ return list.map(a => `<div class="ach">🏆 実績解除「${a.name}」 🪙+${a.r}</div>`).join(''); }
function toastAch(list){
  if (!list.length || typeof document === 'undefined' || !document.createElement || !document.body) return;
  const d = document.createElement('div');
  d.className = 'toast';
  d.innerHTML = achHtml(list);
  document.body.appendChild(d);
  setTimeout(() => { if (d.remove) d.remove(); }, 2800);
}

function showShop(){
  stopTimer();
  panelAlloc = save.alloc;
  let h = `<h1>🛒 ショップ</h1><div class="card">所持メダル <span class="pts">🪙${save.medals}</span><br><span class="small">装備の能力アップはステージ戦のみ有効(デイリーは公平のため無効)。見た目は両方に反映されます。</span></div>`;
  h += `<div class="card">${heroPanel('装備と進化がここに反映されます')}</div>`;
  Object.keys(EQUIP).forEach(k => {
    const e = EQUIP[k], t = save.owned[k], nx = e.tiers[t];
    h += `<div class="card"><b>${e.name}</b> ${t ? `${e.tiers[t - 1].n}(${STAT_LABEL[e.stat]}+${e.tiers[t - 1].v})` : '<span class="small">未所持</span>'}<br>`;
    h += nx ? `<button ${save.medals >= nx.c ? '' : 'disabled'} onclick="buyEquip('${k}')">${nx.n} ${STAT_LABEL[e.stat]}+${nx.v} — 🪙${nx.c}</button>` : `<span class="small">最大まで強化済み</span>`;
    h += `</div>`;
  });
  h += `<div class="card"><b>消耗アイテム</b> <span class="small">(ステージ戦の割り振り画面で「使う」を選ぶ)</span>`;
  Object.keys(ITEMS).forEach(k => {
    const it = ITEMS[k];
    h += `<br>${it.name} ×${save.items[k]} <span class="small">${it.desc}</span><br><button ${save.medals >= it.c ? '' : 'disabled'} onclick="buyItem('${k}')">買う — 🪙${it.c}</button>`;
  });
  h += `</div><button onclick="showHome()">ホームへ</button>`;
  app.innerHTML = h;
}
function buyEquip(k){
  const e = EQUIP[k], nx = e.tiers[save.owned[k]];
  if (!nx || save.medals < nx.c) return;
  save.medals -= nx.c; save.owned[k]++; save.st.bought++;
  const n = checkAch(); persist(); showShop(); toastAch(n);
}
function buyItem(k){
  const it = ITEMS[k];
  if (save.medals < it.c) return;
  save.medals -= it.c; save.items[k]++; save.st.bought++;
  const n = checkAch(); persist(); showShop(); toastAch(n);
}
function itemCard(){
  const ks = Object.keys(ITEMS).filter(k => save.items[k] > 0);
  if (!ks.length) return '';
  let h = `<div class="card"><b>アイテム</b>`;
  ks.forEach(k => {
    const on = save.armed[k];
    h += `<button class="skill ${on ? 'on' : ''}" onclick="toggleArm('${k}')">${ITEMS[k].name} ×${save.items[k]} ${ITEMS[k].desc}${on ? ' 【使用予定】' : ''}</button>`;
  });
  return h + `</div>`;
}
function toggleArm(k){ if (save.items[k] > 0){ save.armed[k] = !save.armed[k]; persist(); showAlloc(curStage); } }
function showAchs(){
  stopTimer();
  let h = `<h1>🏆 実績</h1><div class="card">${Object.keys(save.ach).length} / ${ACH.length} 解除 ・ 🪙${save.medals}</div>`;
  ACH.forEach(a => {
    const on = !!save.ach[a.id];
    h += `<div class="card ${on ? 'win' : ''}">${on ? '✅' : '🔒'} <b>${a.name}</b> <span class="small">🪙+${a.r}</span><br><span class="small">${a.d}</span></div>`;
  });
  h += `<button onclick="showHome()">ホームへ</button>`;
  app.innerHTML = h;
}

if (typeof document !== 'undefined' && document.getElementById('app')) showHome();
</script>
